[project]
name = "jobsworker"
version = "0.1.0"
description = "Ingest worker: fetch, normalize, dedupe and LLM-tag fresher jobs in India"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.scripts]
jobsworker = "jobsworker.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pgserver>=0.1.4", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobsworker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["RUF059", "FURB162"]
