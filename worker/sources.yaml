# Seed for the `sources` table (`jobsworker seed`). Adding a source = adding a row.
#
# Every board below was checked with `jobsworker probe` on 2026-11-16 and had at
# least one India entry-level posting that day. All use the provider's public,
# documented job-posting API (see docs/architecture.md, "Sources and terms").
# Do not add a source without an official API or clear permission.

- key: adzuna:in
  type: adzuna
  config:
    queries: [fresher, intern, internship, graduate trainee, entry level, junior]
    max_pages: 3
    max_days_old: 30

