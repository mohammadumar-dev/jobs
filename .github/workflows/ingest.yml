name: ingest

on:
  schedule:
    - cron: "0 21 * * *" # 02:30 IST daily (GitHub cron is UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: worker
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-haiku-5-5' }}
      CONTACT_URL: ${{ vars.CONTACT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev --frozen
      # The schema is created by the API's Flyway migrations; the worker only writes rows.
      - name: Seed sources
        run: uv run jobsworker seed
      - name: Ingest
        run: uv run jobsworker run
      - name: Stats
        if: always()
        run: uv run jobsworker stats
