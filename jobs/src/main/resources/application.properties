spring.application.name=jobs
# Local convenience: KEY=VALUE pairs from ./.env (gitignored). Real env vars still win.
spring.config.import=optional:file:.env[.properties]

# --- Database (secrets come from the environment only) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobs}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:jobs_api}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
# Flyway owns the schema. To migrate with a different (owner) role than the
# runtime role, set SPRING_FLYWAY_USER / SPRING_FLYWAY_PASSWORD. See docs/db-roles.sql.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Sessions: server-side (Spring Session JDBC), never JWT in the browser ---
spring.session.jdbc.initialize-schema=never
# 7-day idle timeout
spring.session.timeout=7d

# --- Web ---
server.port=${PORT:8080}
# Behind the Next.js rewrite and the host's TLS proxy: trust X-Forwarded-* from them.
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- App ---
# Origin the browser sees (the Next.js site). Used for OAuth redirects.
app.public-origin=${APP_PUBLIC_ORIGIN:http://localhost:3000}
# Shared secret between the Next.js server and this API. When a request carries it in
# X-Proxy-Secret, the API believes its X-Client-IP header (used for rate limiting).
# Empty = never trust X-Client-IP.
app.proxy-secret=${PROXY_SECRET:}
app.security.require-https=true
# Session cookie (configured explicitly in SecurityConfig.cookieSerializer)
app.session-cookie.name=__Host-SESSION
app.session-cookie.secure=true
app.session-cookie.max-age=7d
app.rate-limit.auth-per-minute=5
app.rate-limit.search-per-minute=60
app.lockout.max-failures=10
app.lockout.duration=15m
